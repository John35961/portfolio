        desktop_description: "Touche-à-tout passionné par le graphisme, le code, les interfaces et l'image, je me suis tourné vers la programmation web en suivant Le Wagon début 2022. Ce site rassemble divers projets dont je suis fier."
        long_description: "Issu d'une formation commerciale, j'ai toujours été passionné par l'art et la technique sous toutes leurs formes. Graphisme, vidéo, photo, motion-design, code, communication : ce site (codé en Rails, merci Le Wagon) met en lumière mes principaux projets persos de ces dernières années. Enjoy ;)"
